<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  </head>
  <body>
    <div class="container">
      <div id="quizApp">
        <h1>Quiz App</h1>
        <form action="" >
          <div class="form-group" id="questionOne">
            Question 1: What is the capital of France?

            <div class="radio-group">
              <label>
                <input type="radio" name="q1" value="a" /> A) Berlin
              </label>
              <label>
                <input type="radio" name="q1" value="b" /> B) Madrid
              </label>
              <label>
                <input type="radio" name="q1" value="c" /> C) Paris
              </label>
            </div>
          </div>
          <div class="form-group" id="questionTwo">
            Question 2: How far is America to Nigeria?

            <div class="radio-group">
              <label>
                <input type="radio" name="q2" value="a" /> A) 10,000KM
              </label>
              <label>
                <input type="radio" name="q2" value="b" /> B) 10,700KM
              </label>
              <label>
                <input type="radio" name="q2" value="c" /> C) 11,000KM
              </label>
            </div>
          </div>
          <div class="form-group" id="questionThree">
            Question 3: Where is Jenga Tech located?

            <div class="radio-group">
              <label>
                <input type="radio" name="q3" value="a" /> A) Abuja
              </label>
              <label>
                <input type="radio" name="q3" value="b" /> B) Lagos
              </label>
              <label> <input type="radio" name="q3" value="c" /> C) Aba </label>
            </div>
          </div>
          <div class="form-group" id="questionFour">
            Question 4: Who is the president of Nigeria?

            <div class="radio-group">
              <label>
                <input type="radio" name="q4" value="a" /> A) Bola Ahmed Tinubu
              </label>
              <label>
                <input type="radio" name="q4" value="b" /> B) Muhammadu Buhari
              </label>
              <label>
                <input type="radio" name="q4" value="c" /> C) Goodluck Jonathan
              </label>
            </div>
          </div>

          <button type="submit" id="submitBtn">Submit</button>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
