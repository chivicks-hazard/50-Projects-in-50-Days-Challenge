<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="calculator">
        <input type="text" class="display" disabled />
        <div class="buttons">
          <button id="clear">C</button><button class="operators">()</button>
          <button class="operators">%</button
          ><button class="operators">/</button>
          <button class="numbers">7</button><button class="numbers">8</button
          ><button class="numbers">9</button
          ><button class="operators">*</button>
          <button class="numbers">4</button><button class="numbers">5</button
          ><button class="numbers">6</button
          ><button class="operators">-</button>
          <button class="numbers">1</button><button class="numbers">2</button
          ><button class="numbers">3</button
          ><button class="operators">+</button> <button>+/-</button
          ><button class="numbers">0</button><button>.</button
          ><button class="operators">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
